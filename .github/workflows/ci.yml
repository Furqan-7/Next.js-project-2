name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jobpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jobpilot_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Typecheck (shared, db, backend, frontend)
        run: pnpm typecheck

      - name: Shared logic tests
        run: pnpm --filter shared test

      - name: Backend tests (unit + integration against Postgres)
        run: pnpm --filter backend test

      - name: Frontend lint
        run: pnpm --filter frontend lint

      - name: Frontend build
        run: pnpm --filter frontend build
        env:
          BACKEND_URL: http://localhost:3001

      - name: Backend build
        run: pnpm --filter backend build
